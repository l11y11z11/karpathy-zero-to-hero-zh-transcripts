<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="660" viewBox="0 0 1250 660" role="img" aria-labelledby="title desc">
  <title id="title">WaveNet 层次化感受野</title><desc id="desc">输入字符经过 2-gram、4-gram 等树状层次化融合后预测输出</desc>
  <defs>
