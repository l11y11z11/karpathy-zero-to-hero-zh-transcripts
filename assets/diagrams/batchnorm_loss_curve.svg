  <rect width="100%" height="100%" rx="20" fill="#fffdf8"/>
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="26" font-weight="700" fill="#172033">BatchNorm 前后的损失曲线</text>
  <text x="600" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="17" font-weight="500" fill="#526079" text-anchor="middle">合理初始化与 BatchNorm 让训练从一开始就进入健康区间</text><line x1="150" y1="450" x2="1080" y2="450" stroke="#526079" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><line x1="150" y1="450" x2="150" y2="120" stroke="#526079" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><polyline points="180,170 250,205 320,245 390,290 460,330 530,360 600,385 670,402 740,415 810,425 900,432 1050,438" fill="none" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1090" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="17" font-weight="700" fill="#526079" text-anchor="middle">Iterations</text><text x="130" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="17" font-weight="700" fill="#526079" text-anchor="end">Loss</text>
