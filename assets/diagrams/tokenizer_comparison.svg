<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Tokenizer 路线对比</title><desc id="desc">TikToken / minBPE 与 SentencePiece 的共同目标是稳定编码文本</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="#fffdf8"/>
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="26" font-weight="700" fill="#172033">Tokenizer 路线对比</text>
  <text x="600.0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="17" font-weight="500" fill="#526079" text-anchor="middle">TikToken / minBPE 与 SentencePiece 的共同目标是稳定编码文本</text><rect x="198.0" y="220" width="180" height="112" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="288.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">原始文本</text><text x="288.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">str</text><line x1="378.0" y1="276.0" x2="406.0" y2="276.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="406.0" y="220" width="180" height="112" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="496.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">UTF-8 / Unicode</text><text x="496.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">底层编码</text><line x1="586.0" y1="276.0" x2="614.0" y2="276.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="614.0" y="220" width="180" height="112" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="704.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">BPE 合并</text><text x="704.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">学习高频片段</text><line x1="794.0" y1="276.0" x2="822.0" y2="276.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="822.0" y="220" width="180" height="112" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="912.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">Token IDs</text><text x="912.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">模型输入</text>
</svg>
