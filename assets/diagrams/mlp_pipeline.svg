<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">MLP 语言模型数据流</title><desc id="desc">多个历史字符共享嵌入矩阵，再联合预测下一个字符</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="#fffdf8"/>
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="26" font-weight="700" fill="#172033">MLP 语言模型数据流</text>
  <text x="700.0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="17" font-weight="500" fill="#526079" text-anchor="middle">多个历史字符共享嵌入矩阵，再联合预测下一个字符</text><rect x="90.0" y="220" width="180" height="112" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">输入索引</text><text x="180.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">x₁, x₂, x₃</text><line x1="270.0" y1="276.0" x2="298.0" y2="276.0" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="298.0" y="220" width="180" height="112" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="388.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">Embedding</text><text x="388.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">27 × d</text><line x1="478.0" y1="276.0" x2="506.0" y2="276.0" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="506.0" y="220" width="180" height="112" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="596.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">拼接</text><text x="596.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">Shape 3d</text><line x1="686.0" y1="276.0" x2="714.0" y2="276.0" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="714.0" y="220" width="180" height="112" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="804.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">隐藏层</text><text x="804.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">W₁ + b₁ + tanh</text><line x1="894.0" y1="276.0" x2="922.0" y2="276.0" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="922.0" y="220" width="180" height="112" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1012.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">输出层</text><text x="1012.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">27 logits</text><line x1="1102.0" y1="276.0" x2="1130.0" y2="276.0" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="1130.0" y="220" width="180" height="112" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1220.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">Softmax</text><text x="1220.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">P(y | x₁,x₂,x₃)</text>
</svg>
