<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">特殊 Token 的模型手术</title><desc id="desc">新增特殊 Token 时同步扩展 Embedding 与 LM Head</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="#fffdf8"/>
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="26" font-weight="700" fill="#172033">特殊 Token 的模型手术</text>
  <text x="600" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="17" font-weight="500" fill="#526079" text-anchor="middle">新增一个特殊 Token，需要同时扩展两张矩阵</text><rect x="470" y="150" width="260" height="82" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="600.0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">新增 Special Token</text><text x="600.0" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">词表 V → V + 1</text><rect x="120" y="350" width="350" height="110" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="295.0" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">Embedding Wₑ</text><text x="295.0" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">新增 1 行：R^(V+1) × d</text><rect x="730" y="350" width="350" height="110" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="905.0" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">LM Head W_h</text><text x="905.0" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">新增 1 列：R^d × (V+1)</text><line x1="560" y1="232" x2="300" y2="350" stroke="#ea580c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/><line x1="640" y1="232" x2="900" y2="350" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><text x="600" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">否则模型能读入新 Token，却无法为它输出概率</text>
</svg>
