<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">未训练 Token 的异常路径</title><desc id="desc">词表中存在，不代表 Token 在模型训练中真正被学过</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="#fffdf8"/>
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="26" font-weight="700" fill="#172033">未训练 Token 的异常路径</text>
  <text x="700.0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="17" font-weight="500" fill="#526079" text-anchor="middle">词表中存在，不代表 Token 在模型训练中真正被学过</text><rect x="194.0" y="220" width="180" height="112" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="284.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">Tokenizer 训练集</text><text x="284.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">包含用户名</text><line x1="374.0" y1="276.0" x2="402.0" y2="276.0" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="402.0" y="220" width="180" height="112" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="492.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">专属 Token</text><text x="492.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">一个独立 ID</text><line x1="582.0" y1="276.0" x2="610.0" y2="276.0" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="610.0" y="220" width="180" height="112" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="700.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">LLM 训练集</text><text x="700.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">剔除数据</text><line x1="790.0" y1="276.0" x2="818.0" y2="276.0" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="818.0" y="220" width="180" height="112" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="908.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">随机向量</text><text x="908.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">从未更新</text><line x1="998.0" y1="276.0" x2="1026.0" y2="276.0" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="1026.0" y="220" width="180" height="112" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="1116.0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">OOD 异常</text><text x="1116.0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">推理时崩溃</text>
</svg>
