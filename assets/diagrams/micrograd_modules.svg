  <rect width="100%" height="100%" rx="20" fill="#fffdf8"/>
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="26" font-weight="700" fill="#172033">Micrograd 的两层结构</text>
  <rect x="450" y="145" width="300" height="78" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="600.0" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">Micrograd</text><text x="600.0" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">标量自动微分</text><rect x="120" y="315" width="360" height="112" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">engine.py</text><text x="300.0" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">Value · 拓扑排序 · 反向传播</text><rect x="720" y="315" width="360" height="112" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="900.0" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">nn.py</text><text x="900.0" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">Neuron · Layer · MLP</text><line x1="600" y1="223" x2="300" y2="315" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><line x1="600" y1="223" x2="900" y2="315" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="600" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">先造出自动求导发动机，再把它组装成神经网络</text>
