<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">多层感知机 MLP</title><desc id="desc">输入层、隐藏层和输出层的全连接结构</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="#fffdf8"/>
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="26" font-weight="700" fill="#172033">多层感知机 MLP</text>
  <rect x="120" y="180" width="220" height="86" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="230.0" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">输入层</text><text x="230.0" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">3 inputs</text><rect x="490" y="180" width="220" height="86" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="600.0" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">隐藏层</text><text x="600.0" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">4 neurons</text><rect x="860" y="180" width="220" height="86" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="970.0" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="700" fill="#172033" text-anchor="middle">输出层</text><text x="970.0" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="15" font-weight="500" fill="#526079" text-anchor="middle">1 neuron</text><line x1="340" y1="210" x2="490" y2="210" stroke="#2563eb" stroke-width="1" stroke-linecap="round" marker-end="url(#arrow-blue)"/><line x1="340" y1="235" x2="490" y2="210" stroke="#2563eb" stroke-width="1" stroke-linecap="round" marker-end="url(#arrow-blue)"/><line x1="340" y1="260" x2="490" y2="210" stroke="#2563eb" stroke-width="1" stroke-linecap="round" marker-end="url(#arrow-blue)"/><line x1="710" y1="210" x2="860" y2="223" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)"/><line x1="710" y1="235" x2="860" y2="223" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)"/><line x1="710" y1="260" x2="860" y2="223" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)"/><line x1="710" y1="285" x2="860" y2="223" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)"/><text x="600" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">MLP 只是把神经元按层连接起来</text>
</svg>
